# Shared analyzer, linter and formatter settings for the Dart code in this repo.
# app/ and packages/*/ include this file on top of their base rule set
# (flutter_lints for the app, lints/recommended for the packages).
# Run: make lint (format check) and make test (analyze + tests).

formatter:
  page_width: 140

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - "**/*.g.dart"

linter:
  rules:
    # Bugs and async mistakes
    - avoid_dynamic_calls
    - avoid_print
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    # Style that the formatter does not enforce
    - always_declare_return_types
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
    - missing_whitespace_between_adjacent_strings
    - no_adjacent_strings_in_list
    - noop_primitive_operations
