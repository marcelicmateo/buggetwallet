# Shared rules and formatter settings: ../analysis_options.yaml
include:
  - package:flutter_lints/flutter.yaml
  - ../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - web/**

linter:
  rules:
    - prefer_const_literals_to_create_immutables
    - sized_box_shrink_expand
    - use_colored_box
    - use_decorated_box
