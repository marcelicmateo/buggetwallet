name: budget_wallet
description: "Budget Wallet - personal budgeting. Offline first, end-to-end encrypted sync."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  wallet_core:
    path: ../packages/wallet_core
  wallet_importer:
    path: ../packages/wallet_importer
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
