name: budget_wallet
description: "Budget Wallet - personal budgeting. Offline first, end-to-end encrypted sync."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  wallet_core:
    path: ../packages/wallet_core
  wallet_importer:
    path: ../packages/wallet_importer
  sqlite3: ^3.7.1 # already used by wallet_core; the web database opens it directly (wasm). Native library: see hooks below
  cryptography: ^2.7.0 # already used by wallet_core; the web key store derives its passphrase key with it
  web: ^1.1.0 # localStorage / sessionStorage in the browser key store
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2 # the plugin schedules with it (already a dependency of the plugin)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: any
  relay: # the relay server, started in-process by integration_test/relay_sync_test.dart
    path: ../relay

# sqlite3 3.x ships SQLite through a build hook. SQLite3 Multiple Ciphers = SQLite + encryption (PRAGMA key); an unkeyed
# database opens exactly as with plain SQLite. The web build uses the matching sqlite3mc.wasm (tools/build.sh).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
