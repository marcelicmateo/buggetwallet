name: budget_wallet
description: "Budget Wallet - personal budgeting. Offline first, end-to-end encrypted sync."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  wallet_core:
    path: ../packages/wallet_core
  wallet_importer:
    path: ../packages/wallet_importer
  sqlite3_flutter_libs: ^0.5.0
  path_provider: any
  file_picker: any
  flutter_secure_storage: any
  fl_chart: any
  qr_flutter: any
  permission_handler: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
