name: budget_wallet
description: "Budget Wallet - personal budgeting. Offline first, end-to-end encrypted sync."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.6.0
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  wallet_core:
    path: ../packages/wallet_core
  wallet_importer:
    path: ../packages/wallet_importer
  wallet_sync:
    path: ../packages/sync
  sqlite3: ^3.7.1 # already used by wallet_core; the web database opens it directly (wasm). Native library: see hooks below
  cryptography: ^2.7.0 # already used by wallet_core; the web key store derives its passphrase key with it
  web: ^1.1.0 # localStorage / sessionStorage in the browser key store
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2 # the plugin schedules with it (already a dependency of the plugin)
  mobile_scanner: ^7.4.2
  google_mlkit_text_recognition: ^0.17.1
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: any
  http: ^1.2.0 # MockClient in test/web/relay_web_test.dart (the app reaches http only through wallet_sync)
  relay: # the relay server, started in-process by integration_test/relay_sync_test.dart
    path: ../relay

# sqlite3 3.x ships SQLite through a build hook. SQLite3 Multiple Ciphers = SQLite + encryption (PRAGMA key); an unkeyed
# database opens exactly as with plain SQLite. The web build uses the matching sqlite3mc.wasm (make web).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  fonts:
    # Manrope is one variable file (wght 200-800); the five declared weights make FontWeight pick the matching axis value.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
