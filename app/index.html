<title>Budget Wallet</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone ledger. Hero number on top, cards below, fixed tab bar at the bottom. */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #121716;
  --ink-2: #48514e;
  --muted: #7b8582;
  --line: #dde3e0;
  --accent: #2f45c8;
  --accent-ink: #ffffff;
  --accent-soft: #e5e9fb;
  --pos: #2a78d6;
  --neg: #e34948;
  --good: #0f7a0f;
  --bad: #c23535;
  --warn-bg: #fff4dc;
  --warn-ink: #6b4a00;
  --bar: #2a78d6;
  --bar-ghost: #b9c9e8;
  --grid: #e1e0d9;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1211; --surface: #171c1b; --surface-2: #1d2322; --ink: #e8eeec; --ink-2: #b9c3c0; --muted: #8b9693;
    --line: #2a3230; --accent: #8593ff; --accent-ink: #0e1211; --accent-soft: #232a4a; --pos: #3987e5; --neg: #e66767;
    --good: #3fbf3f; --bad: #f07272; --warn-bg: #3a2f12; --warn-ink: #f3d68c; --bar: #3987e5; --bar-ghost: #2e4466; --grid: #2c2c2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1211; --surface: #171c1b; --surface-2: #1d2322; --ink: #e8eeec; --ink-2: #b9c3c0; --muted: #8b9693;
  --line: #2a3230; --accent: #8593ff; --accent-ink: #0e1211; --accent-soft: #232a4a; --pos: #3987e5; --neg: #e66767;
  --good: #3fbf3f; --bad: #f07272; --warn-bg: #3a2f12; --warn-ink: #f3d68c; --bar: #3987e5; --bar-ghost: #2e4466; --grid: #2c2c2a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 16px; border-radius: 4px; background: var(--accent); position: relative; }
.brand-mark::after { content: ""; position: absolute; right: 3px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--surface); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { background: transparent; border: none; padding: 0; }
.card.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn-ink); }
.card.accent { background: var(--accent-soft); border-color: transparent; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.row > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Hero */
.hero { padding: 20px 18px 18px; gap: 14px; }
.hero-num { font-family: var(--f-display); font-weight: 700; font-size: clamp(54px, 17vw, 76px); line-height: 0.95; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.hero-num .cur { font-size: 0.5em; vertical-align: 0.62em; margin-right: 2px; letter-spacing: 0; color: var(--ink-2); }
.hero-num.over { color: var(--bad); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.status.good { color: var(--good); }
.status.bad { color: var(--bad); }
.stat .v { font-family: var(--f-num); font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); }
.pace { position: relative; height: 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.pace-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 6px 0 0 6px; }
.pace-fill.over { background: var(--bad); }
.pace-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

/* Buttons & inputs */
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.big { padding: 14px 16px; font-size: 16px; width: 100%; border-radius: 13px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.btn:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-2); min-width: 0; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
input.amount { font-family: var(--f-display); font-size: 30px; font-weight: 700; padding: 8px 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 2px; border-top: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 12.5px; color: var(--muted); grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .a { font-family: var(--f-num); font-variant-numeric: tabular-nums; grid-row: 1 / span 2; grid-column: 2; align-self: center; text-align: right; }
.li .a.in { color: var(--good); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); margin-left: 4px; vertical-align: 1px; }

/* Progress */
.prog { height: 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }

/* Charts */
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.chart .lbl { fill: var(--ink-2); }
.chart .val { fill: var(--ink); font-family: var(--f-num); font-size: 11px; }
.hbar { display: grid; grid-template-columns: minmax(96px, 34%) 1fr auto; gap: 4px 10px; align-items: center; font-size: 13.5px; }
.hbar .nm { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { position: relative; height: 14px; }
.hbar .fill { position: absolute; left: 0; top: 1px; bottom: 1px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .avg { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.55; }
.hbar .vv { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; vertical-align: -1px; margin-right: 5px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
.tip .num { color: inherit; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { background: none; border: 0; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 92%; overflow-y: auto; padding-block: 10px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
</style>

  <main id="view"><div class="card"><p class="muted">Opening your wallet…</p></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/*CORE-START*/
// ---------- pure helpers (no DOM) ----------
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
function fixUtf8(s) { try { return decodeURIComponent(escape(s)); } catch (e) { return s; } }
function pad(n) { return String(n).padStart(2, "0"); }
function excelDate(serial) { const d = new Date(Date.UTC(1899, 11, 30) + serial * 86400000); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
function anyDate(v) {
  if (typeof v === "number") return excelDate(v);
  if (v instanceof Date) return v.getFullYear() + "-" + pad(v.getMonth() + 1) + "-" + pad(v.getDate());
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + "-" + m[2] + "-" + m[3];
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if (m) return m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
  return null;
}
function toNum(v) { if (typeof v === "number") return v; const s = String(v).trim().replace(/\s/g, ""); if (/,\d{1,2}$/.test(s)) return parseFloat(s.replace(/\./g, "").replace(",", ".")); return parseFloat(s.replace(/,/g, "")); }
function r2(x) { return Math.round(x * 100) / 100; }
function makeIds(items) {
  const seen = {};
  for (const it of items) {
    const key = it.d + "|" + it.a.toFixed(2) + "|" + it.m;
    const n = seen[key] || 0; seen[key] = n + 1;
    it.i = it.d.replace(/-/g, "").slice(2) + fnv(key) + (n ? "_" + n : "");
  }
  return items;
}
// rows: array of arrays (first sheet). Returns {source, items} or null.
function parseRows(rows) {
  const flat = rows.slice(0, 15).map(r => r.map(c => String(c).trim()));
  const revHdr = flat.findIndex(r => r.includes("Started Date") && r.includes("Description") && r.includes("Amount"));
  if (revHdr >= 0) {
    const h = flat[revHdr]; const col = n => h.indexOf(n);
    const cT = col("Type"), cD = col("Started Date"), cM = col("Description"), cA = col("Amount"), cF = col("Fee"), cS = col("State");
    const items = [];
    for (const r of rows.slice(revHdr + 1)) {
      if (!r || r[cD] === "" || r[cD] == null) continue;
      if (cS >= 0 && String(r[cS]).trim() !== "COMPLETED") continue;
      const d = anyDate(r[cD]); const a = r2(toNum(r[cA]) - (cF >= 0 && r[cF] !== "" ? toNum(r[cF]) : 0));
      if (!d || isNaN(a)) continue;
      items.push({ d, a, t: String(r[cT]).trim(), m: fixUtf8(String(r[cM]).trim()) });
    }
    return { source: "rev", items: makeIds(items) };
  }
  const isPbz = flat.some(r => r.some(c => /TRANSAKCIJSKI RA/i.test(c) || c === "DATUM"));
  if (isPbz) {
    const items = [];
    for (const r of rows) {
      if (!r || r.length < 4) continue;
      const d = (typeof r[0] === "number" && r[0] > 30000) ? excelDate(r[0]) : (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(String(r[0]).trim()) ? anyDate(r[0]) : null);
      if (!d) continue;
      const a = r2(toNum(r[3])); if (isNaN(a)) continue;
      if (/^REZERVACIJA/i.test(String(r[2]).trim())) continue; // card holds: the final row arrives in a later export
      items.push({ d, a, t: String(r[1]).trim(), m: String(r[2]).trim() });
    }
    return { source: "pbz", items: makeIds(items) };
  }
  return null;
}

const CATS = {
  "Salary": { kind: "income" }, "Extra income": { kind: "extra" },
  "Rent": { kind: "fixed" }, "Loan": { kind: "fixed" }, "Bills & subscriptions": { kind: "fixed" },
  "Groceries": { kind: "flex" }, "Food delivery": { kind: "flex" }, "Eating out": { kind: "flex" },
  "Car & transport": { kind: "flex" }, "Shopping": { kind: "flex" }, "Home & tools": { kind: "flex" },
  "Sport & fitness": { kind: "flex" }, "Health & care": { kind: "flex" }, "Games & apps": { kind: "flex" },
  "Cash": { kind: "flex" }, "Bills & one-offs": { kind: "flex" }, "To people": { kind: "flex" }, "Bank fees": { kind: "flex" },
  "Internal transfer": { kind: "transfer" }, "Loan received": { kind: "transfer" },
};
const FLEX_CATS = Object.keys(CATS).filter(k => CATS[k].kind === "flex");
// Built-in rules cover well-known chains and brands only. Personal merchants live in the
// database (settings.merchantPatterns) so no one's spending habits end up in the code.
const MERCHANT_RULES = [
  ["Food delivery", /wolt|bolt food|glovo/],
  ["Bills & subscriptions", /netflix|spotify|1password|anthropic|linkedin|proton|telekom|\ba1\b|hbo|disney|youtube|icloud|openai|chatgpt|^google$/],
  ["Games & apps", /steam|valve|google play|playstation|nintendo|epic games/],
  ["Groceries", /\bspar|lidl|plodine|kaufland|konzum|studenac|tommy|pan-pek|mlinar|eurospin|ribola|pekar/],
  ["Car & transport", /\bina\b|petrol|tifon|shell|crodux|autocest|e-vinjeta|jadrolinija|getbybus|\bbolt\b|uber|parking|\bhak\b|\bzet\b|flixbus/],
  ["Eating out", /restoran|bistro|bar\b|fast food|mcdonald|pizz|grill|caffe|cafe|kafi|burger|kebab|sushi|konoba|\bpub\b/],
  ["Health & care", /ljekarn|pharm|farmac|dm drog|m.ller|poliklinik|hzzo/],
  ["Sport & fitness", /decathlon|fitness|gymbeam/],
  ["Home & tools", /bauhaus|pevex|vidaxl|jysk|ikea|emmezeta|lesnina|\blinks|chipoteka|instar|\bmall\b|cyberport/],
  ["To people", /keks pay/],
];
let USER_RULES = [];
// list: [[category, regexSource], ...] from settings.merchantPatterns; checked before the built-in rules
function setUserPatterns(list) {
  USER_RULES = (Array.isArray(list) ? list : []).map(x => { try { return CATS[x[0]] ? [x[0], new RegExp(x[1], "i")] : null; } catch (e) { return null; } }).filter(Boolean);
}
function merchantCat(desc) { const s = desc.toLowerCase(); for (const [c, re] of USER_RULES) if (re.test(s)) return c; for (const [c, re] of MERCHANT_RULES) if (re.test(s)) return c; return null; }
function merchantName(it) {
  let s = it.m || "";
  s = s.replace(/^PBZ POS PBZ\w/i, "").replace(/^POS /i, "").replace(/\s{2,}/g, " ").trim();
  return s || "(no description)";
}
function merchantKey(it) { return merchantName(it).toLowerCase().replace(/[0-9*#]+/g, " ").replace(/[^a-zÀ-ɏ ]+/g, " ").replace(/\s+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "x"; }
function autoCat(it, src) {
  const d = (it.m || "").toLowerCase(), t = it.t || "", a = it.a;
  if (src === "rev") {
    if (t === "Topup" || t === "Exchange") return "Internal transfer";
    if (t === "Transfer") return "To people";
    return merchantCat(d) || "Shopping";
  }
  if (src === "pbz") {
    if (d.includes("revolut")) return "Internal transfer";
    if (d.includes("isplata kredita")) return "Loan received";
    if (t === "Isplata u poslovnici") return "Cash";
    if (t === "Isplata ATM") return a <= -500 ? "Rent" : "Cash";
    if (t === "Naplaćene naknade" || t === "Povrat naknade" || t === "Pripisane kamate" || d.includes("naknad") || d.includes("članarin")) return "Bank fees";
    if (t === "Trajni nalog" || /naplata kredita|rate kredita|kreditni račun/.test(d)) return "Loan";
    if (t === "Plaća/Mirovina" || d.includes("krive uplate")) return "Salary";
    if (a > 0) return "Extra income";
    if (t === "POS plaćanje") return merchantCat(d) || "Shopping";
    return "Bills & one-offs";
  }
  return it.c || "Shopping";
}
function catOf(it, src, rules) {
  if (it.c && CATS[it.c]) return it.c;
  const auto = autoCat(it, src);
  if (rules && CATS[auto] && (CATS[auto].kind === "flex" || CATS[auto].kind === "fixed") && src !== "man") {

// Flatten month docs -> enriched items

}
// The core budget for the current pay period
function computePeriod(items, st, goals, today) {
  const start = st.periodStart, end = nextPayday(start, st.paydayDay || 15);
  const len = Math.max(1, daysBetween(start, end));
  const daysLeft = Math.max(1, daysBetween(today, end));
  const inP = items.filter(i => i.d >= start && i.d <= today);
  const sum = (arr) => arr.reduce((s, i) => s + i.a, 0);
  const received = r2(sum(inP.filter(i => i.kind === "income")));
  const extras = r2(sum(inP.filter(i => i.kind === "extra")));
  const income = st.incomeMode === "received" && received > 0 ? received : (st.salary || 0);
  const goalMonthly = goals.reduce((s, g) => s + (+g.monthly || 0), 0);
  const fixedPlan = (+st.rent || 0) + (+st.loan || 0) + (+st.subs || 0);
  const flexBudget = r2(income - fixedPlan - goalMonthly);
  const flex = inP.filter(i => i.kind === "flex");
  const spent = r2(-sum(flex));
  const spentToday = r2(-sum(flex.filter(i => i.d === today)));
  const remaining = r2(flexBudget - spent);
  const allowanceToday = r2((flexBudget - (spent - spentToday)) / daysLeft);
  const safeToday = r2(allowanceToday - spentToday);
  const planDaily = r2(flexBudget / len);
  const elapsed = Math.min(1, Math.max(0, (daysBetween(start, today) + 1) / len));
  const fixedPaid = {};
  for (const i of inP.filter(i => i.kind === "fixed")) fixedPaid[i.cat] = r2((fixedPaid[i.cat] || 0) - i.a);
  return { start, end, len, daysLeft, received, extras, income, goalMonthly, fixedPlan, flexBudget, spent, spentToday, remaining, allowanceToday, safeToday, planDaily, elapsed, fixedPaid };
}
function monthSummary(items, month) {
  const inM = items.filter(i => i.d.slice(0, 7) === month);
  let income = 0, out = 0; const byCat = {};
  for (const i of inM) {
    if (i.kind === "income" || i.kind === "extra") income += i.a;
    else if (i.kind === "fixed" || i.kind === "flex") { out += i.a; byCat[i.cat] = (byCat[i.cat] || 0) - i.a; }

  return { month, income: r2(income), out: r2(-out), net: r2(income + out), byCat };
}
function affordability(price, P) {
  const after = P.remaining - Math.max(0, P.allowanceToday - P.safeToday) - price;
  const newDaily = r2((P.flexBudget - P.spent - price) / P.daysLeft);
  let verdict;
  if (newDaily >= P.planDaily * 0.75) verdict = "now";
  else if (P.flexBudget - P.spent - price > 0) verdict = "tight";
  else verdict = "later";
  return { newDaily, verdict, after };
}
/*CORE-END*/

// ---------- app ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const S = { db: null, months: {}, settings: null, settingsLoaded: false, goals: [], wish: [], tab: "today", spendMonth: null, monthsLoaded: false, lastImport: null };
let CUR = "EUR";
function money(x, dec) { const d = dec ?? (Math.abs(x) >= 100 ? 0 : 2); try { return new Intl.NumberFormat("en-IE", { style: "currency", currency: CUR, minimumFractionDigits: d, maximumFractionDigits: d }).format(x); } catch (e) { return x.toFixed(d) + " " + CUR; } }
function money0(x) { return money(x, 0); }
function todayISO() { const t = new Date(); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); }
function fmtDate(iso, opts) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-GB", opts || { day: "numeric", month: "short" }); }
function monthLabel(ym, long) { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-GB", long ? { month: "long", year: "numeric" } : { month: "short" }); }
const ICON = {
  check: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  alert: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  clock: '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  up: '<svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',

// Neutral defaults. Real numbers live only in the database (settings/main).
const DEFAULTS = { salary: 0, rent: 0, loan: 0, loanEnd: null, subs: 0, impulse: 50, coolHours: 72, paydayDay: 15, periodStart: null, currency: "EUR", incomeMode: "planned", rules: {}, merchantPatterns: [], savedFor: null, salaryConfirmed: false };
function st() { return { ...DEFAULTS, ...(S.settings || {}) }; }
function items() { const s = st(); setUserPatterns(s.merchantPatterns); return flatten(S.months, s.rules); }

// ----- write queue: one write at a time per document -----
const queues = {};
function queued(path, fn) { const p = (queues[path] || Promise.resolve()).then(fn, fn); queues[path] = p.catch(() => {}); return p; }
async function writeSettings(patch) {
  const next = { ...st(), ...patch };
  S.settings = next; render();
  return queued("settings/main", () => S.db.doc("settings/main").set(next)).catch(err => toast(errMsg(err)));
}
function errMsg(err) { if (err && err.code === "quota_exceeded") return "Storage is full. Delete old data to keep saving."; if (err && err.code === "invalid_argument") return "That change could not be saved."; return "Could not save. Check your connection and try again."; }
async function setMonthDoc(id, body) { S.months[id] = body; return queued("tx/" + id, () => S.db.doc("tx/" + id).set(body)); }

// ----- toast -----
let toastT;
function toast(msg) { let el = $("#toastEl"); if (!el) { el = document.createElement("div"); el.id = "toastEl"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

// ----- tooltip -----
function bindTips(root) {
  const tip = $("#tip");
  root.querySelectorAll("[data-tip]").forEach(el => {
    const show = e => { const r = el.getBoundingClientRect(); tip.innerHTML = el.getAttribute("data-tip"); tip.style.left = (r.left + r.width / 2) + "px"; tip.style.top = r.top + "px"; tip.hidden = false; };
    el.addEventListener("pointerenter", show); el.addEventListener("pointerdown", show); el.addEventListener("focus", show);

document.addEventListener("scroll", () => { $("#tip").hidden = true; }, { passive: true });

// ----- tabs -----
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; try { sessionStorage.setItem("bw-tab", S.tab); } catch (e) {} render(); window.scrollTo(0, 0); }));
try { const t = sessionStorage.getItem("bw-tab"); if (t) S.tab = t; } catch (e) {}

// ---------- render ----------
function render() {
  document.querySelectorAll(".tabs button").forEach(b => { if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const v = $("#view");
  if (!S.db) { v.innerHTML = S.dbState === "none" ? `<div class="card"><h2>Your wallet is private</h2><p class="muted">Open this page signed in to claude.ai as its owner to see your budget.</p></div>` : `<div class="card"><p class="muted">Opening your wallet…</p></div>`; return; }
  const s = st(); CUR = s.currency || "EUR";
  const all = items();
  const today = todayISO();
  const hasData = all.length > 0;
  if (!s.periodStart) {
    const sal = all.filter(i => i.kind === "income" && i.a > 0)[0];
    s.periodStart = sal ? sal.d : today;
  }
  const P = computePeriod(all, s, S.goals, today);
  $("#periodChip").textContent = `${fmtDate(P.start)} – ${fmtDate(addDays(P.end, -1))}`;
  const html = { today: viewToday, spend: viewSpend, wish: viewWish, goals: viewGoals, plan: viewPlan }[S.tab](all, s, P, today, hasData);
  v.innerHTML = html;
  bindTips(v);
  bindView(v, all, s, P, today);
}

function dataFreshness(all) {
  const last = src => { const x = all.find(i => i.src === src); return x ? fmtDate(x.d) : "none"; };
  return `PBZ ${last("pbz")} · Revolut ${last("rev")}`;
}

function viewToday(all, s, P, today, hasData) {

  const aheadBy = r2(P.flexBudget * P.elapsed - P.spent);
  const parts = [];
  if (!s.salaryConfirmed) parts.push(`<div class="card warn"><div class="row"><div class="stack" style="gap:4px"><h3>Planning on ${money0(s.salary)} a month</h3><p class="small">${s.salary > 0 ? "Check this matches a normal month of pay. Fix it in Plan if not." : "Enter your monthly salary in Plan so the daily budget can be worked out."}</p></div></div><div class="row"><button class="btn sm" data-act="goto-plan">Open Plan</button><button class="btn sm ghost" data-act="confirm-salary">Looks right</button></div></div>`);

  const newSal = all.find(i => i.kind === "income" && i.a > 0 && i.d > addDays(P.start, 20));
  if (newSal) parts.push(`<div class="card accent"><h3>Salary landed on ${fmtDate(newSal.d)}</h3><p class="small">Start a new month to reset your daily budget and run the payday checklist.</p><button class="btn primary" data-act="new-month" data-date="${newSal.d}">Start new month on ${fmtDate(newSal.d)}</button></div>`);

  parts.push(`<section class="card hero" aria-label="Safe to spend today">
    <div class="row"><span class="eyebrow">Safe to spend today</span><span class="status ${over ? "bad" : "good"}">${over ? ICON.alert + "Over today" : ICON.check + "On plan"}</span></div>
    <div class="hero-num ${over ? "over" : ""}">${over ? "−" : ""}${esc(money0(Math.abs(P.safeToday)))}</div>
    <p class="small muted">${P.spentToday > 0 ? `Spent ${money(P.spentToday)} today of ${money(P.allowanceToday)}.` : `Today's allowance is ${money(P.allowanceToday)}.`} Spend less today and tomorrow gets more.</p>
    <div class="grid3">
      <div class="stat"><div class="v">${money0(P.remaining)}</div><div class="k">left until payday</div></div>
      <div class="stat"><div class="v">${P.daysLeft} ${P.daysLeft === 1 ? "day" : "days"}</div><div class="k">to ${fmtDate(P.end)}</div></div>

function txRow(i) {

function viewSpend(all, s, P, today) {
  const months = [];
  const cur = today.slice(0, 7);
  let [y, m] = cur.split("-").map(Number);
  for (let k = 0; k < 13; k++) { months.unshift(y + "-" + pad(m)); m--; if (m === 0) { m = 12; y--; } }
  const sums = months.map(mm => monthSummary(all, mm));

  const selSum = sums.find(x => x.month === sel);
  const prev = sums.filter(x => x.month < sel).slice(-6);

      ? `M${bx},${zeroY} V${yy + 4} Q${bx},${yy} ${bx + 4},${yy} H${bx + w - 4} Q${bx + w},${yy} ${bx + w},${yy + 4} V${zeroY} Z`
      : `M${bx},${zeroY} V${yy + h - 4} Q${bx},${yy + h} ${bx + 4},${yy + h} H${bx + w - 4} Q${bx + w},${yy + h} ${bx + w},${yy + h - 4} V${zeroY} Z`;

  });

  const netSvg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money saved or lost per month, last 13 months">

  // top merchants

  all.filter(i => i.d.slice(0, 7) === sel && i.kind === "flex" && i.a < 0).forEach(i => { const k = merchantName(i); merch[k] = merch[k] || { n: 0, v: 0 }; merch[k].n++; merch[k].v -= i.a; });
  const topM = Object.entries(merch).sort((a, b) => b[1].v - a[1].v).slice(0, 8);
  const monthChips = months.slice(-7).map(mm => `<button data-month="${mm}" aria-pressed="${mm === sel}">${monthLabel(mm)}${mm === cur ? " (now)" : ""}</button>`).join("");

  return `

    <div class="stack" style="gap:4px"><span class="eyebrow">Saving or losing</span>

    <p class="small muted">${savedMonths} of 12 months ended with more money than they started. Bars above the line are months you saved; below the line, months you spent more than came in. This month is still running.</p></div>

    <div class="seg" role="group" aria-label="Month">${monthChips}</div>
    <div class="legend"><span><i style="width:14px;height:10px;border-radius:0 3px 3px 0;background:var(--bar)"></i>${monthLabel(sel)}</span><span><i style="width:2px;height:12px;background:var(--ink);opacity:.55"></i>6-month average</span></div>
    <div class="hbar">${cats.length ? cats.map(c => { const v = selSum.byCat[c] || 0, a = avg[c] || 0; return `<span class="nm">${esc(c)}</span><span class="track" data-tip="<b>${esc(c)}</b><br>${monthLabel(sel)} <span class='num'>${money0(v)}</span> · avg <span class='num'>${money0(a)}</span>" tabindex="0"><span class="fill" style="width:${v / maxV * 100}%"></span><span class="avg" style="left:calc(${a / maxV * 100}% - 1px)"></span></span><span class="vv">${money0(v)}</span>`; }).join("") : `<p class="empty" style="grid-column:1/-1">Nothing spent this month yet.</p>`}</div>
  </div>
  <div class="card">
    <h3>Top places in ${monthLabel(sel, true)}</h3>
    ${topM.length ? `<div class="list">${topM.map(([k, x]) => `<div class="li"><span class="t">${esc(k)}</span><span class="a num">${money(x.v, 0)}</span><span class="s">${x.n} ${x.n === 1 ? "payment" : "payments"}</span></div>`).join("")}</div>` : `<p class="empty">No card spending this month yet.</p>`}
  </div>
  <div class="card">
    <h3>All transactions in ${monthLabel(sel, true)}</h3>
    <p class="small muted">Tap one to change its category. Internal transfers between your accounts are hidden.</p>
    <div class="list">${all.filter(i => i.d.slice(0, 7) === sel && i.kind !== "transfer").map(txRow).join("") || `<p class="empty">No transactions.</p>`}</div>
  </div>`;
}

function hoursLeft(w, s) { return (w.added + (s.coolHours || 72) * 3600000 - Date.now()) / 3600000; }
function viewWish(all, s, P) {
  const waiting = S.wish.filter(w => w.status === "waiting" && hoursLeft(w, s) > 0).sort((a, b) => a.added - b.added);
  const ready = S.wish.filter(w => w.status === "waiting" && hoursLeft(w, s) <= 0);
  const done = S.wish.filter(w => w.status !== "waiting").sort((a, b) => (b.decided || 0) - (a.decided || 0));
  const skippedTotal = done.filter(w => w.status === "skipped").reduce((x, w) => x + (+w.price || 0), 0);
  const wrow = (w, actions) => `<div class="li" style="grid-template-columns:1fr auto"><span class="t">${esc(w.name)}</span><span class="a num">${money(+w.price, 0)}</span><span class="s">${actions}</span></div>`;
  return `
  <div class="card">
    <div class="stack" style="gap:4px"><span class="eyebrow">Can I afford it?</span><h2>Check before you buy</h2>
    <p class="small muted">Anything over ${money0(s.impulse)} waits ${s.coolHours} hours on the wishlist first.</p></div>
    <div class="grid2"><label class="f">What<input id="afName" placeholder="Running shoes" autocomplete="off"></label><label class="f">Price<input id="afPrice" inputmode="decimal" placeholder="120"></label></div>
    <div id="afOut"></div>
  </div>
  <div class="card">

    ${ready.length ? `<div class="list">${ready.map(w => wrow(w, `Waited ${s.coolHours}h · <button class="btn sm" data-wish-buy="${w.id}">Buy it</button> <button class="btn sm ghost" data-wish-skip="${w.id}">Skip</button>`)).join("")}</div>` : `<p class="empty">Nothing has finished waiting yet.</p>`}
  </div>
  <div class="card">
    <div class="row"><h3>Cooling off</h3><span class="tag">${waiting.length}</span></div>
    ${waiting.length ? `<div class="list">${waiting.map(w => { const hl = hoursLeft(w, s); return wrow(w, `${ICON.clock} ${hl >= 24 ? Math.floor(hl / 24) + "d " + Math.round(hl % 24) + "h" : Math.ceil(hl) + "h"} left · <button class="btn sm ghost" data-wish-skip="${w.id}">Don't need it</button>`); }).join("")}</div>` : `<p class="empty">Your wishlist is empty. Check something above to add it.</p>`}
  </div>
  <div class="card">
    <div class="row"><h3>Decided</h3><span class="small">Saved by waiting: <b class="num">${money0(skippedTotal)}</b></span></div>
    ${done.length ? `<div class="list">${done.slice(0, 20).map(w => wrow(w, `${w.status === "bought" ? "Bought" : "Skipped"} ${w.decided ? new Date(w.decided).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : ""}`)).join("")}</div>` : `<p class="empty">Items you buy or skip show up here.</p>`}
  </div>`;
}
function affordHTML(price, name, s, P) {
  if (!(price > 0)) return "";
  const A = affordability(price, P);
  const cut = c => { const d = Math.ceil(price / c); return `${fmtDate(addDays(todayISO(), d), { day: "numeric", month: "short", year: "numeric" })}`; };
  const head = A.verdict === "now" ? `<span class="status good">${ICON.check}Fits this month</span>` : A.verdict === "tight" ? `<span class="status bad">${ICON.alert}Possible, but tight</span>` : `<span class="status bad">${ICON.alert}Not this month</span>`;
  const body = A.verdict === "later" ? `It's more than the ${money0(Math.max(0, P.flexBudget - P.spent))} you have left until payday.` : `Your daily budget would drop from ${money(P.allowanceToday)} to ${money(A.newDaily)} for the next ${P.daysLeft} days.`;
  return `<div class="stack">${head}<p class="small">${body}</p>
    <div class="list"><div class="li"><span class="t">Spend €5/day less</span><span class="a num">${cut(5)}</span><span class="s">ready by</span></div><div class="li"><span class="t">Spend €10/day less</span><span class="a num">${cut(10)}</span><span class="s">ready by</span></div></div>
    <div class="row">${price > (s.impulse || 50) ? `<button class="btn primary" data-act="wish-add">Put on wishlist (${s.coolHours}h)</button>` : `<span class="small muted">Under ${money0(s.impulse)}, no wait needed.</span>`}<button class="btn ghost" data-act="goal-from">Save for it</button></div></div>`;
}

function goalEta(g, P) {
  const left = Math.max(0, (+g.target || 0) - (+g.saved || 0));
  if (left <= 0) return "Reached";
  if (!(+g.monthly > 0)) return "Set a monthly amount";
  const n = Math.ceil(left / +g.monthly);
  const [y, m] = P.end.split("-").map(Number);
  const d = new Date(y, m - 1 + n - 1, 15);
  return d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
}
function viewGoals(all, s, P) {

  <div class="card">
    <div class="stack" style="gap:4px"><span class="eyebrow">Goals</span><h2>${money0(totalSaved)} put aside</h2>

    <div class="stack" style="gap:14px">${S.goals.map(g => { const pct = Math.min(100, (+g.saved || 0) / Math.max(1, +g.target || 1) * 100); return `<button class="li" style="grid-template-columns:1fr auto;border-top:0;padding:0" data-goal="${g.id}">

      <span class="s" style="grid-column:1/-1">${money0(+g.monthly || 0)} a month · ${goalEta(g, P)}</span></button>`; }).join("") || `<p class="empty">No goals yet.</p>`}</div>
    <button class="btn" data-act="goal-new">${ICON.plus}New goal</button>

}

      ${S.goals.map(g => `<div class="li"><span class="t">${esc(g.name)}</span><span class="a num">−${money0(+g.monthly || 0)}</span><span class="s">savings goal</span></div>`).join("")}

// ---------- events ----------
function bindView(v, all, s, P, today) {
  v.querySelectorAll("[data-tx]").forEach(b => b.addEventListener("click", () => openTx(b.dataset.tx)));
  v.querySelectorAll("[data-month]").forEach(b => b.addEventListener("click", () => { S.spendMonth = b.dataset.month; render(); }));
  v.querySelectorAll("[data-goal]").forEach(b => b.addEventListener("click", () => openGoal(S.goals.find(g => g.id === b.dataset.goal))));
  v.querySelectorAll("[data-income]").forEach(b => b.addEventListener("click", () => writeSettings({ incomeMode: b.dataset.income })));
  v.querySelectorAll("[data-wish-buy]").forEach(b => b.addEventListener("click", () => decideWish(b.dataset.wishBuy, "bought")));
  v.querySelectorAll("[data-wish-skip]").forEach(b => b.addEventListener("click", () => decideWish(b.dataset.wishSkip, "skipped")));
  v.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act, b, P)));
  const af = $("#afPrice", v);
  if (af) {
    const upd = () => { $("#afOut").innerHTML = affordHTML(toNum($("#afPrice").value || "0"), $("#afName").value, s, P); $("#afOut").querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act, b, P))); };
    af.addEventListener("input", upd); $("#afName").addEventListener("input", upd);
  }
  const f = $("#pFile", v); if (f) f.addEventListener("change", () => importFiles([...f.files]));
}
async function act(a, el, P) {
  const s = st();
  if (a === "add") return openAdd();
  if (a === "goto-plan") { S.tab = "plan"; render(); window.scrollTo(0, 0); return; }
  if (a === "confirm-salary") return writeSettings({ salaryConfirmed: true });
  if (a === "new-month") return startMonth(el.dataset.date);
  if (a === "new-month-pick") return startMonth($("#pStart").value);
  if (a === "saved-done") {
    for (const g of S.goals) await queued("goals/" + g.id, () => S.db.doc("goals/" + g.id).set({ ...stripId(g), saved: r2((+g.saved || 0) + (+g.monthly || 0)) }));
    await writeSettings({ savedFor: P.start }); toast("Savings logged"); return;
  }
  if (a === "save-plan") {
    const n = id => toNum($(id).value);
    const patch = { salary: n("#pSalary"), rent: n("#pRent"), loan: n("#pLoan"), subs: n("#pSubs"), impulse: n("#pImpulse"), coolHours: Math.round(n("#pCool")), paydayDay: Math.min(28, Math.max(1, Math.round(n("#pPayday")))), currency: $("#pCur").value };
    if (Object.values(patch).some(x => typeof x === "number" && !(x >= 0))) return toast("Enter numbers only, like 1500 or 1500.50.");
    if (patch.salary !== s.salary) patch.salaryConfirmed = true;
    await writeSettings(patch); toast("Plan saved"); return;
  }
  if (a === "wish-add") {
    const name = $("#afName").value.trim() || "Wishlist item", price = toNum($("#afPrice").value);
    await addWish(name, price); $("#afName").value = ""; $("#afPrice").value = ""; $("#afOut").innerHTML = ""; return;
  }
  if (a === "goal-from") { openGoal(null, { name: $("#afName").value.trim() || "Big purchase", target: toNum($("#afPrice").value) || 0, monthly: 50 }); return; }
  if (a === "goal-new") return openGoal(null);
}
function stripId(o) { const { id, ...rest } = o; return rest; }
async function startMonth(date) {
  if (!date) return;
  await writeSettings({ periodStart: date, incomeMode: "planned" });
  toast("New month started " + fmtDate(date)); S.tab = "today"; render();
}
async function addWish(name, price) {
  if (!(price > 0)) return toast("Enter a price first.");
  try { await S.db.collection("wish").add({ name, price: r2(price), added: Date.now(), status: "waiting" }); toast(`On the wishlist. Decide in ${st().coolHours} hours.`); }
  catch (e) { toast(errMsg(e)); }
}
async function decideWish(id, status) {
  const w = S.wish.find(x => x.id === id); if (!w) return;
  await queued("wish/" + id, () => S.db.doc("wish/" + id).set({ ...stripId(w), status, decided: Date.now() })).catch(e => toast(errMsg(e)));
  if (status === "bought") { toast("Log it with Add expense when you pay"); openAdd({ amount: w.price, note: w.name, skipImpulse: true }); }
  else toast(`Skipped. ${money0(+w.price)} stays in your pocket.`);
}

// ---------- sheets ----------

function sheet(html, bind) {
  $("#layer").innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>${html}</div></div>`;
  $("#layer").querySelectorAll("[data-close]").forEach(e => e.addEventListener("click", closeSheet));
  bind($("#layer"));
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function openAdd(pre = {}) {
  const s = st();
  let cat = pre.cat || "Groceries";
  sheet(`<div class="row"><h2>Add expense</h2><button class="btn sm ghost" data-close>Cancel</button></div>
    <label class="f">Amount<input id="aAmt" class="amount" inputmode="decimal" placeholder="0.00" value="${pre.amount ?? ""}" autocomplete="off"></label>
    <div class="stack"><span class="small muted">Category</span><div class="seg" id="aCats">${FLEX_CATS.filter(c => c !== "Bank fees").map(c => `<button data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("")}</div></div>
    <div class="grid2"><label class="f">Note<input id="aNote" placeholder="Lunch with Ana" value="${esc(pre.note || "")}" autocomplete="off"></label><label class="f">Date<input id="aDate" type="date" value="${todayISO()}"></label></div>

}
async function addManual({ amount, cat, note, date }) {
  const id = "man-" + date.slice(0, 7);
  const doc = S.months[id] || { source: "man", month: date.slice(0, 7), items: [] };
  const it = { i: "m" + Date.now().toString(36), d: date, a: -r2(amount), m: note || cat, c: cat, man: 1 };
  try { await setMonthDoc(id, { ...doc, items: [...doc.items, it] }); toast(`Added ${money(amount)} · ${cat}`); render(); }
  catch (e) { toast(errMsg(e)); }
}

function openTx(ref) {
  const [docId, iid] = ref.split("|"); const doc = S.months[docId]; if (!doc) return;

}

function openGoal(g, pre = {}) {

// ---------- import ----------
async function importFiles(files) {
  const out = $("#impOut"); if (out) out.innerHTML = `<p class="small">Reading ${files.length} ${files.length === 1 ? "file" : "files"}…</p>`;
  if (typeof XLSX === "undefined") { if (out) out.innerHTML = `<p class="status bad">${ICON.alert}The file reader didn't load. Reload the page and try again.</p>`; return; }
  const lines = [];
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
      const parsed = parseRows(rows);
      if (!parsed) { lines.push(`<p class="status bad">${ICON.alert}${esc(f.name)}: not a PBZ or Revolut export I recognise.</p>`); continue; }
      const r = await mergeImport(parsed);
      lines.push(`<p class="small">${ICON.check} <b>${parsed.source === "pbz" ? "PBZ" : "Revolut"}</b>: ${r.added} new, ${r.dupes} already here${r.matched ? `, ${r.matched} matched to expenses you added` : ""}.</p>`);
    } catch (e) { lines.push(`<p class="status bad">${ICON.alert}${esc(f.name)}: ${esc(e && e.code ? errMsg(e) : "couldn't read this file.")}</p>`); }
  }
  S.lastImport = lines.join("");
  render();
}
async function mergeImport({ source, items: list }) {
  const byM = {}; list.forEach(it => { (byM[it.d.slice(0, 7)] = byM[it.d.slice(0, 7)] || []).push(it); });
  let dupes = 0; const freshBy = {};
  for (const mm of Object.keys(byM)) {
    const doc = S.months[source + "-" + mm];
    const have = new Set((doc ? doc.items : []).map(x => x.i));
    const add = byM[mm].filter(x => !have.has(x.i));
    dupes += byM[mm].length - add.length;
    if (add.length) freshBy[mm] = add;
  }
  // match hand-added expenses to new bank rows (same amount, within 3 days); the bank row keeps your category
  let matched = 0; const touched = {};
  const fresh = Object.values(freshBy).flat();
  for (const b of fresh) {
    const k0 = (CATS[autoCat(b, source)] || {}).kind;
    if (b.a >= 0 || (k0 !== "flex" && k0 !== "fixed")) continue;
    for (const mm of [...new Set([b.d.slice(0, 7), addDays(b.d, -4).slice(0, 7), addDays(b.d, 4).slice(0, 7)])]) {
      const id = "man-" + mm; const doc = touched[id] || S.months[id]; if (!doc) continue;
      const k = doc.items.findIndex(x => !x.mt && Math.abs(x.a - b.a) < 0.005 && Math.abs(daysBetween(x.d, b.d)) <= 3);
      if (k >= 0) { const items2 = doc.items.slice(); items2[k] = { ...items2[k], mt: b.i }; touched[id] = { ...doc, items: items2 }; matched++; if (doc.items[k].c) b.c = doc.items[k].c; break; }
    }
  }
  let added = 0;
  for (const mm of Object.keys(freshBy).sort()) {
    const id = source + "-" + mm; const doc = S.months[id] || { source, month: mm, items: [] };
    added += freshBy[mm].length;
    await setMonthDoc(id, { source, month: mm, items: [...doc.items, ...freshBy[mm]].sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0) });
  }
  for (const id in touched) await setMonthDoc(id, touched[id]);
  return { added, dupes, matched };
}

// ---------- boot ----------
(async function boot() {
  render();
  const db = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { S.dbState = "none"; render(); return; }
  S.db = db; render();
  db.collection("tx").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.months = m; S.monthsLoaded = true; render(); }, err => toast(errMsg(err)));
  db.doc("settings/main").onSnapshot(d => { S.settings = d.exists ? d.data() : null; S.settingsLoaded = true; render(); }, err => toast(errMsg(err)));
  db.collection("goals").onSnapshot(snap => { S.goals = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0)); render(); }, err => toast(errMsg(err)));
  db.collection("wish").onSnapshot(snap => { S.wish = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, err => toast(errMsg(err)));
  setInterval(() => { if (!$("#layer").innerHTML && S.tab !== "plan" && document.activeElement?.tagName !== "INPUT") render(); }, 60000);
})();
</script>
