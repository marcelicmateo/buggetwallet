<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D1 · Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#eef1ef;color:#121716;font-family:'Roboto',system-ui,sans-serif;">

<div aria-hidden="true" style="position:absolute;inset:0;">
  <div style="height:64px;padding:0 16px;display:flex;align-items:center;gap:10px;">
    <span style="width:36px;height:36px;border-radius:10px;background:{{accent}};"></span>
    <span style="font-size:19px;font-weight:700;flex:1;">Budget Wallet</span>
    <span style="height:32px;padding:0 10px;border-radius:8px;border:1px solid #dde3e0;background:#ffffff;display:inline-flex;align-items:center;font-size:13px;font-weight:500;">10 Oct – 9 Nov</span>
  </div>
  <div style="margin:0 16px;background:#ffffff;border:1px solid #dde3e0;border-radius:14px;padding:18px;">
    <div style="font-size:15px;font-weight:500;color:#48514e;">Safe to spend today</div>
    <div style="margin-top:6px;font-size:68px;line-height:68px;font-weight:800;letter-spacing:-2px;">14<span style="font-size:36px;font-weight:700;letter-spacing:0;color:#48514e;">&nbsp;€</span></div>
    <div style="margin-top:12px;font-size:14px;color:#48514e;">Today's allowance is 14.10&nbsp;€.</div>
  </div>
  <div style="margin:14px 16px 0;height:56px;border-radius:28px;background:{{accent}};"></div>
  <div style="position:absolute;inset:0;background:rgba(18,23,22,0.5);"></div>
</div>

<section role="dialog" aria-label="Add expense" style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:28px 28px 0 0;padding:0 20px 24px;">
  <div style="width:32px;height:4px;border-radius:2px;background:#c5ccc9;margin:12px auto 0;"></div>
  <div style="height:56px;display:flex;align-items:center;justify-content:space-between;">
    <h1 style="margin:0;font-size:22px;font-weight:700;">Add expense</h1>
    <button type="button" aria-label="Close" style="width:44px;height:44px;margin-right:-10px;border:none;border-radius:22px;background:transparent;color:#48514e;display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </div>

  <div style="position:relative;margin-top:8px;height:72px;border:2px solid {{accent}};border-radius:10px;padding:0 16px;display:flex;align-items:center;gap:8px;box-sizing:border-box;">
    <label for="amt" style="position:absolute;top:-9px;left:12px;padding:0 4px;background:#ffffff;font-size:12px;font-weight:500;color:{{accent}};">Amount</label>
    <input id="amt" type="text" inputmode="decimal" value="65.00" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Roboto Mono',monospace;font-size:34px;font-weight:700;color:#121716;padding:0;">
    <span style="font-family:'Roboto Mono',monospace;font-size:24px;font-weight:500;color:#48514e;">€</span>
  </div>

  <div style="margin-top:16px;font-size:13px;font-weight:500;color:#48514e;">Category</div>
  <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;">
    <button type="button" aria-pressed="false" style="height:44px;padding:0 14px;border-radius:8px;border:1px solid #c5ccc9;background:#ffffff;color:#121716;font-family:'Roboto',sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Groceries</button>
    <button type="button" aria-pressed="false" style="height:44px;padding:0 14px;border-radius:8px;border:1px solid #c5ccc9;background:#ffffff;color:#121716;font-family:'Roboto',sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Eating out</button>
    <button type="button" aria-pressed="false" style="height:44px;padding:0 14px;border-radius:8px;border:1px solid #c5ccc9;background:#ffffff;color:#121716;font-family:'Roboto',sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Transport</button>
    <button type="button" aria-pressed="true" style="height:44px;padding:0 14px 0 10px;border-radius:8px;border:1px solid #dee1f9;background:#dee1f9;color:#121716;font-family:'Roboto',sans-serif;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>Shopping</button>
    <button type="button" aria-pressed="false" style="height:44px;padding:0 14px;border-radius:8px;border:1px solid #c5ccc9;background:#ffffff;color:#121716;font-family:'Roboto',sans-serif;font-size:14px;font-weight:500;cursor:pointer;">Food delivery</button>
  </div>

  <div style="margin-top:18px;display:grid;grid-template-columns:1.4fr 1fr;gap:12px;">
    <div style="position:relative;height:56px;border:1px solid #c5ccc9;border-radius:10px;padding:0 14px;display:flex;align-items:center;box-sizing:border-box;">
      <label for="note" style="position:absolute;top:-8px;left:10px;padding:0 4px;background:#ffffff;font-size:12px;color:#48514e;">Note</label>
      <input id="note" type="text" value="Jacket" style="width:100%;border:none;outline:none;background:transparent;font-family:'Roboto',sans-serif;font-size:16px;color:#121716;padding:0;">
    </div>
    <div style="position:relative;height:56px;border:1px solid #c5ccc9;border-radius:10px;padding:0 10px 0 14px;display:flex;align-items:center;gap:6px;box-sizing:border-box;">
      <label for="date" style="position:absolute;top:-8px;left:10px;padding:0 4px;background:#ffffff;font-size:12px;color:#48514e;">Date</label>
      <input id="date" type="text" value="Today" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Roboto',sans-serif;font-size:16px;color:#121716;padding:0;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#48514e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M9 3.5v4M15 3.5v4"></path></svg>
    </div>
  </div>

  <div role="status" style="margin-top:16px;background:#fff4dc;color:#6b4a00;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
    <div>
      <div style="font-size:15px;line-height:20px;font-weight:700;">Over 50&nbsp;€: wishlist first?</div>
      <div style="margin-top:2px;font-size:14px;line-height:20px;">Your rule says big buys wait 72 hours.</div>
    </div>
  </div>

  <div style="margin-top:18px;display:grid;gap:8px;">
    <button type="button" style="height:52px;border:none;border-radius:26px;background:{{accent}};color:#ffffff;font-family:'Roboto',sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"></path></svg>Put on wishlist</button>
    <button type="button" style="height:52px;border:1px solid #c5ccc9;border-radius:26px;background:#ffffff;color:{{accent}};font-family:'Roboto',sans-serif;font-size:16px;font-weight:700;cursor:pointer;">Add expense anyway</button>
  </div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f45c8"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return { accent: this.props.accent ?? '#2f45c8' }; } }
</script>
</body>
</html>
