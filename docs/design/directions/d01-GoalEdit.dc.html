<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D1 · Edit goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&amp;family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;overflow:hidden;position:relative;background:#eef1ef;color:#121716;font-family:'Roboto',system-ui,sans-serif;">

<div aria-hidden="true" style="position:absolute;inset:0;">
  <div style="height:64px;padding:0 16px;display:flex;align-items:center;gap:10px;">
    <span style="width:36px;height:36px;border-radius:10px;background:{{accent}};"></span>
    <span style="font-size:22px;font-weight:700;">Goals</span>
  </div>
  <div style="margin:0 16px;background:#ffffff;border:1px solid #dde3e0;border-radius:14px;padding:16px 18px;">
    <div style="font-size:48px;line-height:52px;font-weight:800;letter-spacing:-1.5px;">1,950<span style="font-size:26px;letter-spacing:0;color:#48514e;">&nbsp;€</span> <span style="font-size:16px;font-weight:500;letter-spacing:0;color:#48514e;">put aside</span></div>
    <div style="margin-top:6px;font-size:14px;color:#48514e;">Each goal takes its monthly amount off the top on payday.</div>
  </div>
  <div style="margin:14px 16px 0;background:#ffffff;border:1px solid #dde3e0;border-radius:14px;padding:0 16px;">
    <div style="padding:14px 0;"><div style="font-size:16px;font-weight:700;">Emergency fund</div><div style="margin-top:8px;height:8px;border-radius:4px;background:#eef1ef;"><div style="width:40%;height:8px;border-radius:4px;background:{{accent}};"></div></div></div>
    <div style="padding:14px 0;border-top:1px solid #dde3e0;"><div style="font-size:16px;font-weight:700;">Yearly costs</div><div style="margin-top:8px;height:8px;border-radius:4px;background:#eef1ef;"><div style="width:25%;height:8px;border-radius:4px;background:{{accent}};"></div></div></div>
    <div style="padding:14px 0;border-top:1px solid #dde3e0;"><div style="font-size:16px;font-weight:700;">New laptop</div><div style="margin-top:8px;height:8px;border-radius:4px;background:#eef1ef;"><div style="width:32.1%;height:8px;border-radius:4px;background:{{accent}};"></div></div></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(18,23,22,0.5);"></div>
</div>

<section role="dialog" aria-label="Edit goal" style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:28px 28px 0 0;padding:0 20px 24px;">
  <div style="width:32px;height:4px;border-radius:2px;background:#c5ccc9;margin:12px auto 0;"></div>
  <div style="height:56px;display:flex;align-items:center;justify-content:space-between;">
    <h1 style="margin:0;font-size:22px;font-weight:700;">Edit goal</h1>
    <button type="button" aria-label="Close" style="width:44px;height:44px;margin-right:-10px;border:none;border-radius:22px;background:transparent;color:#48514e;display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </div>

  <div style="position:relative;margin-top:10px;height:56px;border:1px solid #c5ccc9;border-radius:10px;padding:0 14px;display:flex;align-items:center;box-sizing:border-box;">
    <label for="gname" style="position:absolute;top:-8px;left:10px;padding:0 4px;background:#ffffff;font-size:12px;color:#48514e;">Name</label>
    <input id="gname" type="text" value="New laptop" style="width:100%;border:none;outline:none;background:transparent;font-family:'Roboto',sans-serif;font-size:16px;color:#121716;padding:0;">
  </div>

  <div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div style="position:relative;height:56px;border:1px solid #c5ccc9;border-radius:10px;padding:0 14px;display:flex;align-items:center;gap:4px;box-sizing:border-box;">
      <label for="gtarget" style="position:absolute;top:-8px;left:10px;padding:0 4px;background:#ffffff;font-size:12px;color:#48514e;">Target</label>
      <input id="gtarget" type="text" inputmode="decimal" value="1,400" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:500;color:#121716;padding:0;">
      <span style="font-family:'Roboto Mono',monospace;font-size:16px;color:#48514e;">€</span>
    </div>
    <div style="position:relative;height:56px;border:2px solid {{accent}};border-radius:10px;padding:0 13px;display:flex;align-items:center;gap:4px;box-sizing:border-box;">
      <label for="gmonth" style="position:absolute;top:-9px;left:9px;padding:0 4px;background:#ffffff;font-size:12px;font-weight:500;color:{{accent}};">Each month</label>
      <input id="gmonth" type="text" inputmode="decimal" value="80" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:500;color:#121716;padding:0;">
      <span style="font-family:'Roboto Mono',monospace;font-size:16px;color:#48514e;">€</span>
    </div>
  </div>

  <div style="position:relative;margin-top:20px;height:56px;border:1px solid #c5ccc9;border-radius:10px;padding:0 14px;display:flex;align-items:center;gap:4px;box-sizing:border-box;">
    <label for="gsaved" style="position:absolute;top:-8px;left:10px;padding:0 4px;background:#ffffff;font-size:12px;color:#48514e;">Put aside so far</label>
    <input id="gsaved" type="text" inputmode="decimal" value="450" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Roboto Mono',monospace;font-size:16px;font-weight:500;color:#121716;padding:0;">
    <span style="font-family:'Roboto Mono',monospace;font-size:16px;color:#48514e;">€</span>
  </div>

  <div role="status" style="margin-top:16px;border-radius:14px;background:#e5e9fb;color:#121716;padding:14px 16px;display:flex;align-items:center;gap:12px;">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f45c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="4" y="5.5" width="16" height="14.5" rx="2"></rect><path d="M4 10h16M9 3.5v4M15 3.5v4"></path></svg>
    <span style="font-size:16px;line-height:22px;">Reached in <b>Oct 2027</b></span>
  </div>

  <div style="margin-top:22px;display:flex;gap:12px;">
    <button type="button" style="height:52px;padding:0 18px;border:none;border-radius:26px;background:transparent;color:#c23535;font-family:'Roboto',sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15"></path><path d="M9.5 7V4.5h5V7"></path><path d="M6.5 7l1 13h9l1-13"></path></svg>Delete</button>
    <button type="button" style="flex:1;height:52px;border:none;border-radius:26px;background:{{accent}};color:#ffffff;font-family:'Roboto',sans-serif;font-size:16px;font-weight:700;cursor:pointer;">Save goal</button>
  </div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f45c8"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return { accent: this.props.accent ?? '#2f45c8' }; } }
</script>
</body>
</html>
