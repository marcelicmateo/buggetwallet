        <div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#4a463e;">Safe to spend today</div>
        <div style="margin-top:4px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:72px;line-height:.95;letter-spacing:-3px;">14&nbsp;€</div>
        <div style="margin-top:6px;font-size:12px;line-height:1.5;color:#4a463e;">Today's allowance is 14.10&nbsp;€. Spend less today and tomorrow gets more.</div>

        <div style="display:flex;justify-content:space-between;"><span>Left until payday</span><b>310.00&nbsp;€</b></div>

      </div>

        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid #1a1a1a;border-radius:2px;background:transparent;color:#1a1a1a;font:500 13px/1 'JetBrains Mono',monospace;cursor:pointer;">Groceries</button>
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid #1a1a1a;border-radius:2px;background:transparent;color:#1a1a1a;font:500 13px/1 'JetBrains Mono',monospace;cursor:pointer;">Eating out</button>
          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid #1a1a1a;border-radius:2px;background:transparent;color:#1a1a1a;font:500 13px/1 'JetBrains Mono',monospace;cursor:pointer;">Transport</button>

          <button type="button" aria-pressed="false" style="display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid #1a1a1a;border-radius:2px;background:transparent;color:#1a1a1a;font:500 13px/1 'JetBrains Mono',monospace;cursor:pointer;">Food delivery</button>
        </div>
      </fieldset>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;">

        <div>

        </div>
      </div>

      <div role="note" style="margin-top:16px;border:1.5px solid #1a1a1a;">
        <div style="background:#1a1a1a;color:#fffdf7;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;display:flex;align-items:center;gap:7px;"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Impulse check</div>

          <p style="margin:3px 0 0;font-size:12.5px;color:#4a463e;">Your rule says big buys wait 72 hours.</p>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px;">
        <button type="button" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;padding:0 12px;border:0;border-radius:2px;background:{{accent}};color:#ffffff;font:700 14px/1 'JetBrains Mono',monospace;cursor:pointer;box-shadow:0 2px 0 #1a1a1a;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>Put on wishlist</button>
