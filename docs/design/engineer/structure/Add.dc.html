<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.r{font-family:'Geist',system-ui,sans-serif;color:#16181D;background:#5E6168;position:relative;overflow:hidden;box-sizing:border-box}
.r *{box-sizing:border-box}
.m{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.mu{color:#5B606B}
.lab{font-size:13px;font-weight:600;color:#3F444D}
.fld{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;border:1px solid #CFD1CB;border-radius:12px;background:#FFFFFF;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #E2E3DE;background:#FFFFFF;font:500 14px 'Geist',sans-serif;color:#16181D;cursor:pointer}
.chip.on{background:#16181D;color:#FFFFFF;border-color:#16181D}
.seg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border-radius:12px;border:1px solid #E2E3DE;background:#FFFFFF;font:500 12px 'Geist',sans-serif;color:#3F444D;text-decoration:none}
.seg.on{border-color:#0D6B58;background:#E3F1EC;color:#0A5546;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:#16181D;color:#FFFFFF;font:600 15px 'Geist',sans-serif;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:12px;border:1px solid #CFD1CB;background:#FFFFFF;color:#16181D;font:600 15px 'Geist',sans-serif;text-decoration:none;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:#0D6B58}a:hover{color:#0A5546}
</style>
</helmet>
<div class="r" style="width: 390px; height: 844px">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 56px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Add</h2>
      <a href="Today.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16181D; border-radius: 12px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <a class="seg on" href="Add.dc.html" aria-current="true"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Expense</a>
      <a class="seg" href="Bill.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 12h8"></path></svg>Scan bill</a>
      <a class="seg" href="Inbox.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Import file</a>
      <a class="seg" href="Save.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="18" cy="12" r="1.2"></circle></svg>More</a>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="lab">Amount</span>
      <span class="fld" style="min-height: 64px; border: 2px solid #0D6B58"><input class="m" value="120.00" aria-label="Amount" style="border: 0; outline: none; flex: 1; font: 600 30px 'Geist Mono', monospace; color: #16181D; min-width: 0; background: transparent"><span class="m" style="font-size: 22px">€</span></span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span class="lab">What / where</span>
      <span class="fld"><input value="Running shoes" aria-label="What or where" style="border: 0; outline: none; flex: 1; font: 400 16px 'Geist', sans-serif; min-width: 0; background: transparent"></span>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="lab">Tag <span class="mu" style="font-weight: 400">· suggested, tap one</span></span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="4">
          <button class="{{t.cls}}" onClick="{{t.pick}}" aria-pressed="{{t.on}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button class="fld" style="justify-content: space-between; font: 400 15px 'Geist', sans-serif; color: #16181D; cursor: pointer"><span><span class="mu" style="font-size: 12px; display: block; text-align: left">Account</span>Cash</span><span aria-hidden="true">▾</span></button>
      <button class="fld" style="justify-content: space-between; font: 400 15px 'Geist', sans-serif; color: #16181D; cursor: pointer"><span><span class="mu" style="font-size: 12px; display: block; text-align: left">Date</span>Today</span><span aria-hidden="true">▾</span></button>
    </div>

    <div style="border-radius: 16px; background: #FBEBE2; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 15px; font-weight: 700; color: #8A3312">Over 50 €: wait 72 hours first?</div>
      <div style="font-size: 14px; line-height: 20px">It fits now, but today drops to <span class="m" style="font-weight: 600">0.00 €</span> and every day after to <span class="m" style="font-weight: 600">19.70 €</span>. On the wishlist you decide on <b>Thu 5 Nov</b>.</div>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px">
      <a class="btn2" href="Today.dc.html">Add anyway</a>
      <a class="btn" href="Save.dc.html">Put on wishlist</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'Sport' }; }
  renderVals() {
    const labels = ['Sport', 'Clothes', 'Gifts', 'Other…'];
    const tags = labels.map((l) => ({
      label: l,
      on: this.state.picked === l ? 'true' : 'false',
      cls: this.state.picked === l ? 'chip on' : 'chip',
      pick: () => this.setState({ picked: l })
    }));
    return { tags: tags };
  }
}
</script>
</body>
</html>
