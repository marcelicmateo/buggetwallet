<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check a scanned bill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.r{font-family:'Geist',system-ui,sans-serif;color:#16181D;background:#F5F5F2;position:relative;overflow:hidden;box-sizing:border-box}
.r *{box-sizing:border-box}
.m{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.card{background:#FFFFFF;border:1px solid #E2E3DE;border-radius:16px}
.ey{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#5B606B}
.mu{color:#5B606B}
.f{display:flex;flex-direction:column;gap:6px}
.lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:#3F444D}
.in{min-height:50px;border:1px solid #CFD1CB;border-radius:12px;padding:0 14px;font:400 16px 'Geist',sans-serif;color:#16181D;background:#FFFFFF;width:100%}
.in.uns{border:2px solid #C9772E;background:#FFF8F1}
.uns-t{font-size:12px;font-weight:600;color:#8A4A10;background:#FCE9D4;border-radius:6px;padding:2px 7px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #E2E3DE;background:#FFFFFF;font:500 14px 'Geist',sans-serif;color:#16181D;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:#16181D;color:#FFFFFF;font:600 15px 'Geist',sans-serif;text-decoration:none;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #CFD1CB;background:#FFFFFF;color:#16181D;font:600 14px 'Geist',sans-serif;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a{color:#0D6B58}a:hover{color:#0A5546}
</style>
</helmet>
<div class="r" style="width: 390px; height: 1100px; padding: 12px 16px 104px; display: flex; flex-direction: column; gap: 12px">
  <header style="display: flex; align-items: center; gap: 4px">
    <a href="Inbox.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16181D"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">Check bill</h1>
    <button aria-label="More: delete bill, show original file" style="width: 44px; height: 44px; border: 0; background: transparent; color: #16181D; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="12" cy="18" r="1.2"></circle></svg></button>
  </header>

  <section class="card" style="padding: 12px 14px; display: flex; gap: 12px; align-items: center">
    <div style="width: 56px; height: 72px; border-radius: 8px; background: #EEEFEA; border: 1px solid #E2E3DE; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #5B606B">Photo</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 600">Payment slip, scanned today</span>
      <span class="mu" style="font-size: 13px">Not counted yet. 2 fields need a look.</span>
    </div>
  </section>

  <section class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <label class="f"><span class="lab">Payee</span><input class="in" value="Power company" aria-label="Payee"></label>
    <label class="f"><span class="lab">Amount <span class="uns-t">Unsure · read from photo</span></span><input class="in uns m" value="48.20 €" aria-label="Amount, unsure" style="font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 600"></label>
    <label class="f"><span class="lab">Due date <span class="uns-t">Unsure</span></span><input class="in uns" value="Fri 20 Nov 2026" aria-label="Due date, unsure"></label>
    <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px">
      <label class="f"><span class="lab">IBAN</span><input class="in m" value="HR00 0000 …" aria-label="IBAN" style="font-family: 'Geist Mono', monospace; font-size: 14px"></label>
      <label class="f"><span class="lab">Reference</span><input class="in m" value="HR01 1234" aria-label="Reference" style="font-family: 'Geist Mono', monospace; font-size: 14px"></label>
    </div>
    <div class="f">
      <span class="lab">Tag <span class="mu" style="font-weight: 400">needed to hold money</span></span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button class="chip" style="background: #16181D; color: #FFFFFF; border-color: #16181D" aria-pressed="true">Utilities</button>
        <button class="chip">Home</button>
        <button class="chip">Other…</button>
      </div>
    </div>
    <div class="f">
      <span class="lab">Belongs to</span>
      <button class="in" style="text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer"><span>Electricity · every month</span><span aria-hidden="true">›</span></button>
    </div>
  </section>

  <details class="card" style="padding: 0 16px">
    <summary style="min-height: 52px; display: flex; align-items: center; font-size: 15px; font-weight: 600; cursor: pointer">Warranty, return by, line items</summary>
    <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px">
      <span class="mu" style="font-size: 13px">Each date: tap for a calendar, or 14d · 1m · 1y · 2y, with its own reminder.</span>
    </div>
  </details>

  <section class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span class="ey">Paying it</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button class="btn2">Copy pay details</button>
      <button class="btn2">Paid by bank row…</button>
      <button class="btn2">Paid in cash</button>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E2E3DE">
    <a class="btn" href="Inbox.dc.html" style="width: 100%">Confirm bill · holds 48.20 € until paid</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
