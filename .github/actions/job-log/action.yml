# Last step of every ci.yml job (use with `if: always()`): stores the job's step log, seconds per step, step outcomes
# and history lines as the artifact ci-log-<job>. The `log` job of ci.yml merges them into ci-logs:latest.txt.
# Needs LOG, BW_DATA_DIR and BW_SOURCE from the workflow env. `outcomes` is "step=outcome ..." for the job's steps.
name: job-log
description: Collect a ci.yml job's log for the ci-logs branch
inputs:
  job:
    description: Job name (artifact ci-log-<job>)
    required: true
  outcomes:
    description: 'Step outcomes, e.g. "signing=success apk=failure"'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: wallet-build ci job-log --job "$JOB" --outcomes "$OUTCOMES"
      env:
        JOB: ${{ inputs.job }}
        OUTCOMES: ${{ inputs.outcomes }}
    - uses: actions/upload-artifact@v4
      with:
        name: ci-log-${{ inputs.job }}
        path: ${{ runner.temp }}/joblog
        retention-days: 1
