# Lints, builds and tests everything: the same checks as `tools/build.sh all` locally, plus the Linux desktop
# integration tests and release smoke test (`tools/build.sh desktop-test`, `desktop-smoke`).
# The full log is pushed to the `ci-logs` branch (latest.txt, with seconds per step) and one JSON line per step is
# appended to history.jsonl there (tools/build-times.sh --ci), so both can be read without the Actions UI.
# Logs contain only build/test output.
name: ci
on:
  push:
    branches: [v2, master]
    paths-ignore: ["**.md"]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOG: ${{ github.workspace }}/../ci.log
      # tools/build.sh history (steps.jsonl, test stats) goes here; Publish log turns it into ci-logs:history.jsonl
      BW_DATA_DIR: ${{ github.workspace }}/../bw-data
      BW_SOURCE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: lint (dart format, shellcheck, actionlint)
        id: lint
        continue-on-error: true
        run: |
          dev/install-lint-tools.sh "$RUNNER_TEMP/bin" 2>&1 | tee -a "$LOG"
          .github/scripts/timed.sh lint "PATH=$RUNNER_TEMP/bin:\$PATH BW_NATIVE=1 tools/build.sh lint"
      # The same list as the local image (dev/Containerfile): Linux build toolchain plus Xvfb, Mesa, D-Bus and fonts
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sed 's/#.*//' dev/linux-packages.txt | xargs sudo apt-get install -y -qq --no-install-recommends >/dev/null
      # Same commands as locally: analyze + tests with a JSON report and per-test timings (tools/build_log.py)
      - name: importer tests
        id: importer
        continue-on-error: true
        run: .github/scripts/timed.sh importer 'BW_NATIVE=1 tools/build.sh importer'
      - name: core tests
        id: core
        continue-on-error: true
        run: .github/scripts/timed.sh core 'BW_NATIVE=1 tools/build.sh core'
      - name: app analyze + test
        id: app
        continue-on-error: true
        run: .github/scripts/timed.sh app 'BW_NATIVE=1 tools/build.sh app'
      # Every app/integration_test/*_test.dart on the Linux desktop app under Xvfb (screenshots in the artifact below)
      - name: linux desktop tests
        id: desktop
        if: steps.app.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/timed.sh desktop 'BW_NATIVE=1 tools/build.sh desktop-test'
      - name: Android signing key
        id: signing
        if: steps.app.outcome == 'success'
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret missing (run tools/make-signing-key.sh --upload)" | tee -a "$LOG"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Without this every run downloads the NDK, CMake, the Gradle distribution and all dependencies (~9 min)
      - name: Android cache paths
        id: android-cache
        if: steps.signing.outcome == 'success'
        run: |
          flutter_root=$(dirname "$(dirname "$(command -v flutter)")")
          ndk=$(grep -oP 'val ndkVersion\s*:\s*String\s*=\s*"\K[^"]+' "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          { echo "ndk=$ndk"; echo "ndk-dir=$ANDROID_HOME/ndk/$ndk"; echo "cmake-dir=$ANDROID_HOME/cmake/3.22.1"; } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.signing.outcome == 'success'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ steps.android-cache.outputs.ndk-dir }}
            ${{ steps.android-cache.outputs.cmake-dir }}
          key: android-${{ steps.android-cache.outputs.ndk }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle.properties', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: android-${{ steps.android-cache.outputs.ndk }}-
      - name: build android apk
        id: apk
        if: steps.signing.outcome == 'success'
        continue-on-error: true
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: .github/scripts/timed.sh apk 'cd app && flutter build apk --release 2>&1 | tail -40'
      - name: build linux
        id: linux
        if: steps.app.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/timed.sh linux 'BW_NATIVE=1 tools/build.sh linux 2>&1 | tail -40'
      # Starts the release bundle under Xvfb with an empty HOME: it must stay up, log app.start without SEVERE, exit on SIGTERM
      - name: linux release smoke test
        id: smoke
        if: steps.linux.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/timed.sh smoke 'BW_NATIVE=1 tools/build.sh desktop-smoke'
      - name: Upload Linux test screenshots and logs
        if: always() && (steps.desktop.outcome != 'skipped' || steps.smoke.outcome != 'skipped')
        uses: actions/upload-artifact@v4
        with:
          name: budget-wallet-linux-tests
          path: |
            dist/screens/linux
            dist/logs/app-linux-*.log
            dist/logs/desktop-*.log
          if-no-files-found: ignore
      - name: Upload Android app
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: budget-wallet-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Linux app
        if: steps.linux.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: budget-wallet-linux
          path: app/build/linux/x64/release/bundle
      - name: Publish dev release (Android + Linux)
        if: steps.apk.outcome == 'success' && github.ref_name == 'v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist && mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/BudgetWallet-android.apk
          if [ "${{ steps.linux.outcome }}" = "success" ]; then tar -C app/build/linux/x64/release -czf dist/BudgetWallet-linux-x64.tar.gz bundle; fi
          gh release delete dev --cleanup-tag -y 2>/dev/null || true
          gh release create dev dist/* --target "$GITHUB_SHA" --prerelease --title "Budget Wallet (development build)" \
            --notes "Latest development build from ${GITHUB_SHA::7}. Android: install BudgetWallet-android.apk. Linux: unpack and run bundle/budget_wallet. All platforms are built by the release workflow."
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t() { awk -v s="$1" '$1 == s { printf "(%ss)", $2 }' "$RUNNER_TEMP/times.txt" 2>/dev/null; }
          {
            echo "lint=${{ steps.lint.outcome }}$(t lint) importer=${{ steps.importer.outcome }}$(t importer) core=${{ steps.core.outcome }}$(t core) app=${{ steps.app.outcome }}$(t app) desktop=${{ steps.desktop.outcome }}$(t desktop) signing=${{ steps.signing.outcome }} apk=${{ steps.apk.outcome }}$(t apk) linux=${{ steps.linux.outcome }}$(t linux) smoke=${{ steps.smoke.outcome }}$(t smoke)"
            echo
            echo "step seconds exit"
            cat "$RUNNER_TEMP/times.txt" 2>/dev/null
            echo
            cat "$LOG" 2>/dev/null
          } > "$RUNNER_TEMP/ci.txt"
          python3 -I tools/build_log.py ci-history "$RUNNER_TEMP/times.txt" > "$RUNNER_TEMP/history.jsonl" || true
          .github/scripts/publish-log.sh latest "$RUNNER_TEMP/ci.txt" "$RUNNER_TEMP/history.jsonl"
      - name: Fail if a step failed
        if: steps.lint.outcome == 'failure' || steps.importer.outcome == 'failure' || steps.core.outcome == 'failure' || steps.app.outcome == 'failure' || steps.desktop.outcome == 'failure' || steps.smoke.outcome == 'failure' || steps.signing.outcome == 'failure' || steps.apk.outcome == 'failure' || steps.linux.outcome == 'failure'
        run: exit 1
