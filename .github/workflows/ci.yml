# Manual only (owner, 2026-10-21): nothing runs on push; the owner starts this workflow (Actions tab, or `gh workflow run ci --ref v2`)
# when a release is ready, and release.yml calls it with release: true. Always: `apk` (signed release APK), `linux` (release bundle +
# smoke test), `publish` (dev release on v2) and `log`. Lint, package tests, analyze and the desktop tests run with the `tests` input
# (jobs lint, importer, core (+ sync), relay, app, desktop; publish then waits for them and is skipped if one failed).
# Every step is `wallet-build ci step <name> -- wallet-build <command>` (tools/wallet-build; .github/actions/setup builds it): it
# writes the step log and the seconds. Each job stores them as the artifact ci-log-<job> (.github/actions/job-log); the `log` job
# merges them into ci-logs:latest.txt (release: release-android-linux.txt) and appends one JSON line per step to history.jsonl there
# (`wallet-build ci status|log`, `wallet-build times --ci`). Logs contain only build/test output. Each job runs on its own runner.
name: ci
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Also run lint, importer, core, sync, relay, app and desktop tests
        type: boolean
        default: false
  workflow_call:
    inputs:
      tests:
        type: boolean
        default: false
      release:
        description: Called by release.yml (no dev release; the log is published as release-android-linux)
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_KEYSTORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
permissions:
  contents: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  LOG: ${{ github.workspace }}/../ci.log
  BW_DATA_DIR: ${{ github.workspace }}/../bw-data # history (steps.jsonl, test stats) that job-log turns into history lines
  BW_SOURCE: ci
  BW_NATIVE: 1
  BW_APK_ABIS: arm64
  # Step limits for the slow runners (the wallet-build defaults are set for the laptop, ~4.6x faster). About 3x the CI medians of
  # ci-logs history.jsonl (app 128 s, desktop 591 s, apk 134 s) and not below the slowest runs seen (app 565 s, desktop 1341 s,
  # apk 475 s cold): the other steps keep the defaults (their CI maxima are far below them). `ci step` itself sets no limit.
  BW_TIMEOUT_APP: 1800
  BW_HEADLESS_TIMEOUT: 3300 # the whole combined desktop run (the separate files took 1381 s in total on the slowest run seen); a timeout names the file it stopped in
  BW_TIMEOUT_DESKTOP: 3600 # the whole desktop job step
  BW_TIMEOUT_APK: 2400
jobs:
  lint:
    if: ${{ inputs.tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - { shell: bash, run: 'dev/install-lint-tools.sh "$RUNNER_TEMP/bin" 2>&1 | tee -a "$LOG" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"' }
      - { id: lint, run: wallet-build ci step lint -- wallet-build lint }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: lint, outcomes: "lint=${{ steps.lint.outcome }}" }

  importer:
    if: ${{ inputs.tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { linux-libs: true }
      - { id: importer, run: wallet-build ci step importer -- wallet-build importer }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: importer, outcomes: "importer=${{ steps.importer.outcome }}" }

  # packages/sync (wallet_sync) runs on core's runner: it shares core's pub cache and build hooks
  core:
    if: ${{ inputs.tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { linux-libs: true }
      - { id: core, run: wallet-build ci step core -- wallet-build core }
      - { id: sync, if: '!cancelled()', run: wallet-build ci step sync -- wallet-build sync }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: core, outcomes: "core=${{ steps.core.outcome }} sync=${{ steps.sync.outcome }}" }

  relay:
    if: ${{ inputs.tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { linux-libs: true }
      - { id: relay, run: wallet-build ci step relay -- wallet-build relay }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: relay, outcomes: "relay=${{ steps.relay.outcome }}" }

  app:
    if: ${{ inputs.tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { linux-libs: true }
      - { id: app, run: wallet-build ci step app -- wallet-build app }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: app, outcomes: "app=${{ steps.app.outcome }}" }

  # Every app/integration_test/*_test.dart on the Linux desktop app under Xvfb (screenshots in the artifact)
  desktop:
    needs: app
    if: ${{ inputs.tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { linux-libs: true }
      # One combined entry file: the app builds and starts once (the local desktop-test runs one file at a time)
      - { id: desktop, run: wallet-build ci step desktop -- wallet-build desktop-test, env: { BW_DESKTOP_COMBINED: "1" } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-wallet-linux-tests-desktop
          path: |
            dist/screens/linux
            dist/logs/app-linux-*.log
            dist/logs/desktop-*.log
          if-no-files-found: ignore
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: desktop, outcomes: "desktop=${{ steps.desktop.outcome }}" }

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { android: true }
      - { id: signing, run: wallet-build ci keystore, env: { ANDROID_KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" } }
      # Signed with the release key only (build.gradle.kts has no debug-key fallback when BW_KEYSTORE is set); wallet-build also
      # checks the APK's signer against the key
      - id: apk
        run: wallet-build ci step apk -- wallet-build apk
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        if: steps.apk.outcome == 'success'
        with: { name: budget-wallet-android, path: app/build/app/outputs/flutter-apk/app-release.apk }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: apk, outcomes: "signing=${{ steps.signing.outcome }} apk=${{ steps.apk.outcome }}" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { linux-libs: true }
      - { id: linux, run: wallet-build ci step linux -- wallet-build linux }
      # Starts the release bundle under Xvfb with an empty HOME: it must stay up, log app.start without SEVERE, exit on SIGTERM
      - { id: smoke, run: wallet-build ci step smoke -- wallet-build desktop-smoke }
      - uses: actions/upload-artifact@v4
        if: always() && steps.smoke.outcome != 'skipped'
        with:
          name: budget-wallet-linux-tests
          path: |
            dist/screens/linux
            dist/logs/app-linux-*.log
            dist/logs/desktop-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: steps.linux.outcome == 'success'
        with: { name: budget-wallet-linux, path: app/build/linux/x64/release/bundle }
      # Artifacts lose file modes, so the releases get a tarball made here
      - id: pack
        if: steps.linux.outcome == 'success'
        run: mkdir -p "$RUNNER_TEMP/rel" && tar -C app/build/linux/x64/release -czf "$RUNNER_TEMP/rel/BudgetWallet-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        if: steps.pack.outcome == 'success'
        with: { name: release-linux-tar, path: "${{ runner.temp }}/rel/BudgetWallet-linux-x64.tar.gz", retention-days: 1 }
      - uses: ./.github/actions/job-log
        if: always()
        with: { job: linux, outcomes: "linux=${{ steps.linux.outcome }} smoke=${{ steps.smoke.outcome }}" }

  # Waits for the test jobs (skipped ones do not block) and for both builds; any failure skips it. release.yml publishes its own.
  publish:
    needs: [lint, importer, core, relay, app, desktop, apk, linux]
    if: ${{ !cancelled() && !inputs.release && github.ref_name == 'v2' && needs.apk.result == 'success' && needs.linux.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: budget-wallet-android, path: "${{ runner.temp }}/rel" }
      - uses: actions/download-artifact@v4
        with: { name: release-linux-tar, path: "${{ runner.temp }}/rel" }
      - name: Publish dev release (Android + Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/rel"
          mv app-release.apk BudgetWallet-android.apk
          gh release delete dev --cleanup-tag -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create dev BudgetWallet-android.apk BudgetWallet-linux-x64.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Budget Wallet (development build)" \
            --notes "Latest development build from ${GITHUB_SHA::7}. Android: install BudgetWallet-android.apk. Linux: unpack and run bundle/budget_wallet. All platforms are built by the release workflow."

  # Merges every job's ci-log-<job> artifact into ci-logs:latest.txt. Line 3 is the step outcomes line (`wallet-build ci status`
  # prints it), line 4 the job results; then "step seconds exit" and the step logs.
  log:
    needs: [lint, importer, core, relay, app, desktop, apk, linux, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - { uses: ./.github/actions/setup, with: { flutter: false } }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "ci-log-*", path: "${{ runner.temp }}/logs" }
      - name: Publish log
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          NAME: ${{ inputs.release && 'release-android-linux' || 'latest' }}
        run: |
          wallet-build ci merge --artifacts "$RUNNER_TEMP/logs" --needs-json "$NEEDS" --out "$RUNNER_TEMP/ci.txt" --history "$RUNNER_TEMP/history.jsonl"
          wallet-build ci publish-log "$NAME" "$RUNNER_TEMP/ci.txt" "$RUNNER_TEMP/history.jsonl"
