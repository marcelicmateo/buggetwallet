# Builds and tests everything. The full log is pushed to the `ci-logs` branch (latest.txt)
# so it can be read without access to the Actions UI. Logs contain only build/test output.
name: ci
on:
  push:
    branches: [v2, master]
    paths-ignore: ["**.md"]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOG: ${{ github.workspace }}/../ci.log
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          cache: true
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev ninja-build libgtk-3-dev libsecret-1-dev >/dev/null
      - name: importer tests
        id: importer
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== importer ===" | tee -a "$LOG"
          cd packages/wallet_importer && dart pub get 2>&1 | tee -a "$LOG" && dart analyze 2>&1 | tee -a "$LOG" && dart test -r expanded 2>&1 | tee -a "$LOG"
      - name: core tests
        id: core
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== core ===" | tee -a "$LOG"
          if [ -d packages/wallet_core ]; then cd packages/wallet_core && dart pub get 2>&1 | tee -a "$LOG" && dart analyze 2>&1 | tee -a "$LOG" && dart test -r expanded 2>&1 | tee -a "$LOG"; fi
      - name: app analyze + test
        id: app
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== app ===" | tee -a "$LOG"
          cd app && flutter pub get 2>&1 | tee -a "$LOG" && flutter analyze --no-fatal-infos 2>&1 | tee -a "$LOG" && flutter test 2>&1 | tee -a "$LOG"
      - name: Android signing key
        id: signing
        if: steps.app.outcome == 'success'
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret missing (run tools/make-signing-key.sh --upload)" | tee -a "$LOG"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: build android apk
        id: apk
        if: steps.signing.outcome == 'success'
        continue-on-error: true
        env:
          BW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          echo "=== apk ===" | tee -a "$LOG"
          cd app && flutter build apk --release 2>&1 | tail -40 | tee -a "$LOG"
      - name: build linux
        id: linux
        if: steps.app.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== linux ===" | tee -a "$LOG"
          cd app && flutter build linux --release 2>&1 | tail -40 | tee -a "$LOG"
      - name: Upload Android app
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: budget-wallet-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload Linux app
        if: steps.linux.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: budget-wallet-linux
          path: app/build/linux/x64/release/bundle
      - name: Publish dev release (Android + Linux)
        if: steps.apk.outcome == 'success' && github.ref_name == 'v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/BudgetWallet-android.apk
          if [ "${{ steps.linux.outcome }}" = "success" ]; then tar -C app/build/linux/x64/release -czf dist/BudgetWallet-linux-x64.tar.gz bundle; fi
          gh release delete dev --cleanup-tag -y 2>/dev/null || true
          gh release create dev dist/* --target "$GITHUB_SHA" --prerelease --title "Budget Wallet (development build)" \
            --notes "Latest development build from ${GITHUB_SHA::7}. Android: install BudgetWallet-android.apk. Linux: unpack and run bundle/budget_wallet. All platforms are built by the release workflow."
      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "importer=${{ steps.importer.outcome }} core=${{ steps.core.outcome }} app=${{ steps.app.outcome }} signing=${{ steps.signing.outcome }} apk=${{ steps.apk.outcome }} linux=${{ steps.linux.outcome }}"
            echo
            cat "$LOG" 2>/dev/null
          } > "$RUNNER_TEMP/ci.txt"
          .github/scripts/publish-log.sh latest "$RUNNER_TEMP/ci.txt"
      - name: Fail if a step failed
        if: steps.importer.outcome == 'failure' || steps.core.outcome == 'failure' || steps.app.outcome == 'failure' || steps.signing.outcome == 'failure' || steps.apk.outcome == 'failure' || steps.linux.outcome == 'failure'
        run: exit 1
