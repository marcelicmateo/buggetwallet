# Builds every platform and publishes the downloads as a GitHub Release.
# Manual only (owner, 2026-10-21): started from the Actions tab (or `gh workflow run release --ref master`) when a release is
# ready; nothing runs on push. macOS runners bill 10x minutes (Windows 2x) on private repos, and Windows/macOS are parked.
# Android + Linux are built by ci.yml (called with release: true: signed APK, release bundle, smoke test, log published as
# ci-logs:release-android-linux); Windows and Apple are built here.
name: release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with: { tests: false, release: true }
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cd app
          flutter pub get --enforce-lockfile 2>&1 | tee -a ../build.log
          flutter build windows --release 2>&1 | tail -40 | tee -a ../build.log
          mkdir -p ../dist
          cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../../dist/BudgetWallet-windows-x64.zip . > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }
      - if: always()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: .github/scripts/publish-log.sh release-windows build.log

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version-file: app/pubspec.yaml, cache: true }
      - name: Build macOS and iOS (unsigned)
        run: |
          set -o pipefail
          cd app
          flutter pub get --enforce-lockfile 2>&1 | tee -a ../build.log
          flutter build macos --release 2>&1 | tail -40 | tee -a ../build.log
          flutter build ios --release --no-codesign 2>&1 | tail -40 | tee -a ../build.log
          mkdir -p ../dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/budget_wallet.app" ../dist/BudgetWallet-macos.zip
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ../dist/BudgetWallet-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: apple, path: dist/* }
      - if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: .github/scripts/publish-log.sh release-apple build.log

  publish:
    needs: [build, windows, apple]
    if: always() && (needs.build.result == 'success' || needs.windows.result == 'success' || needs.apple.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # one artifact each, so that the test logs and ci-log-* artifacts of the called ci.yml stay out of the release; a missing one is a failed build
      - { uses: actions/download-artifact@v4, continue-on-error: true, with: { name: budget-wallet-android, path: dist } }
      - { uses: actions/download-artifact@v4, continue-on-error: true, with: { name: release-linux-tar, path: dist } }
      - { uses: actions/download-artifact@v4, continue-on-error: true, with: { name: windows, path: dist } }
      - { uses: actions/download-artifact@v4, continue-on-error: true, with: { name: apple, path: dist } }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mv dist/app-release.apk dist/BudgetWallet-android.apk 2>/dev/null || true
          ls -la dist
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"; title="Budget Wallet ${{ github.ref_name }}"; pre=""
          elif [ "${{ github.ref_name }}" = "master" ]; then
            tag="latest"; title="Budget Wallet (latest)"; pre=""
          else
            tag="dev-all"; title="Budget Wallet (development build, all platforms)"; pre="--prerelease"
          fi
          notes="Built from ${GITHUB_SHA::7} on ${{ github.ref_name }}.

          - Android: BudgetWallet-android.apk (install directly)
          - Linux: BudgetWallet-linux-x64.tar.gz (run bundle/budget_wallet)
          - Windows: BudgetWallet-windows-x64.zip (run budget_wallet.exe)
          - macOS: BudgetWallet-macos.zip (unsigned: right-click > Open the first time)
          - iPhone: BudgetWallet-ios-unsigned.ipa (unsigned: install with Sideloadly or AltStore using your Apple ID)

          Missing files mean that platform's build failed this time."
          if [ "${{ github.ref_type }}" != "tag" ]; then gh release delete "$tag" --cleanup-tag -y 2>/dev/null || true; fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes "$notes" $pre
