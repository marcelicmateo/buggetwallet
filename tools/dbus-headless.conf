<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Private session bus for desktop-test, desktop-smoke and perf (make headless): like the stock session.conf but
     with no activatable services. The image ships xdg-desktop-portal for live mode's file pickers; started here (no
     DISPLAY on the bus, no fuse) it only produces errors and stalls the app's start. Nothing in these runs needs a service. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
